# Example model routing configuration for AgentGuard proxy.
#
# When enabled, requests are automatically routed to different
# models based on complexity metrics. Tiers are evaluated in order;
# the first matching tier wins.
#
# Usage:
#   agentguard proxy https://api.example.com --routing-config routing.yaml

enabled: true
default_tier: standard

tiers:
  # Fast tier for simple, short requests
  - name: fast
    model: claude-sonnet-4
    max_tokens: 10000
    max_messages: 10

  # Standard tier for medium-complexity requests
  - name: standard
    model: claude-sonnet-4
    max_tokens: 40000
    max_messages: 100

  # Premium tier for complex requests or specific keywords
  - name: premium
    model: claude-opus-4
    patterns:
      - "architect"
      - "security.*audit"
      - "complex.*design"
      - "refactor.*entire"
