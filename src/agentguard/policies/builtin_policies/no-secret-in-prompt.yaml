name: no-secret-in-prompt
description: Block secrets, credentials, and API keys in messages sent to LLMs
rules:
  - action: llm_request
    description: Block API keys and platform tokens in outbound messages
    deny:
      - pattern: 'sk-(?:proj-)?[A-Za-z0-9]{20,}'
      - pattern: 'ghp_[A-Za-z0-9]{36,}'
      - pattern: 'github_pat_[A-Za-z0-9_]{22,}'
      - pattern: 'AKIA[0-9A-Z]{16}'
    severity: critical
    scan: messages
    min_unique_chars: 10
  - action: llm_request
    description: Block credentials and password assignments in outbound messages
    deny:
      - pattern: 'AWS_SECRET_ACCESS_KEY\s*=\s*\S+'
      - pattern: '(?i)password\s*[=:]\s*(?![\s\$"''*<\[{]|str\b|Optional|None\b|\w+[.(\[])[A-Za-z0-9]\S{5,}'
      - pattern: 'Bearer\s+eyJ[A-Za-z0-9\-._~+/]+'
      - pattern: 'Bearer\s+[A-Za-z0-9\-._~+/]{32,}=*'
      - pattern: '-----BEGIN\s+(?:RSA\s+)?PRIVATE\s+KEY-----'
    severity: critical
    scan: messages
  - action: llm_request
    description: Block database connection strings and webhook URLs in outbound messages
    deny:
      - pattern: '(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis)://[^:\s]+:[^@\s]+@[^\s]+'
      - pattern: 'https?://hooks\.slack\.com/services/\S+'
      - pattern: 'https?://discord\.com/api/webhooks/\S+'
    severity: critical
    scan: messages
