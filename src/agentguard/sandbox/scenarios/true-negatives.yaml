# True Negative scenarios: benign content that MUST be allowed.
# These test for false positives — the exact patterns that caused the
# production context-poisoning issue when legitimate code was denied.

---
name: bearer-in-documentation
description: The word Bearer in API documentation (no actual token)
expected_outcome: allow
tags: [secrets, llm-request, bearer, true-negative]
actions:
  - kind: llm_request
    params:
      messages: "The Authorization header uses Bearer tokens. Add the header like: Authorization: Bearer <token>"

---
name: bearer-with-placeholder
description: Bearer token with an obvious placeholder value
expected_outcome: allow
tags: [secrets, llm-request, bearer, true-negative]
actions:
  - kind: llm_request
    params:
      messages: "Authorization: Bearer YOUR_TOKEN_HERE"

---
name: bearer-with-short-example
description: Bearer token with a short example value (under 32 chars)
expected_outcome: allow
tags: [secrets, llm-request, bearer, true-negative]
actions:
  - kind: llm_request
    params:
      messages: "Authorization: Bearer abc123"

---
name: bearer-in-code-comment
description: Bearer mentioned in a code comment explaining auth flow
expected_outcome: allow
tags: [secrets, llm-request, bearer, true-negative]
actions:
  - kind: llm_request
    params:
      messages: "# This endpoint requires a Bearer token for authentication"

---
name: password-type-annotation
description: Password in a Python type annotation (not a real credential)
expected_outcome: allow
tags: [secrets, llm-request, password, true-negative]
actions:
  - kind: llm_request
    params:
      messages: "def create_user(username: str, password: str) -> User:"

---
