---
name: config-file-write-no-secrets
description: Writing a config file without any secrets
expected_outcome: allow
tags: [file-write, true-negative]
actions:
  - kind: file_write
    params:
      path: /project/config.yaml
      content: "database:\n  host: localhost\n  port: 5432\n  name: myapp"

---
name: python-file-write-no-secrets
description: Writing a Python file with no credentials
expected_outcome: allow
tags: [file-write, true-negative]
actions:
  - kind: file_write
    params:
      path: /project/utils.py
      content: "def calculate_total(items):\n    return sum(item.price for item in items)"

