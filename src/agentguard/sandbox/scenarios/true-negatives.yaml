---
name: test-file-write
description: Writing a test file that mentions auth patterns in assertions
expected_outcome: allow
tags: [file-write, true-negative]
actions:
  - kind: file_write
    params:
      path: /project/tests/test_auth.py
      content: "def test_login_requires_password():\n    response = client.post('/login', json={'username': 'test'})\n    assert response.status_code == 400"

---
name: password-hash-function
description: Code that hashes a password (referring to password variable, not literal)
expected_outcome: allow
tags: [secrets, llm-request, password, true-negative]
actions:
  - kind: llm_request
    params:
      messages: "password_hash = hashlib.sha256(password.encode()).hexdigest()"

